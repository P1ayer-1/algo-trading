<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BloFin BTC Live Support/Resistance</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="chart-wrap" aria-label="Live BTC price chart">
      <header>
        <div>
          <h1 id="title">BTC-USDT live chart</h1>
          <div class="meta" id="subtitle">Waiting for market data...</div>
        </div>
        <div class="status" id="status">connecting</div>
      </header>
      <div id="chart"></div>
    </section>
    <aside>
      <div class="small">Last price</div>
      <div class="price" id="lastPrice">--</div>

      <h2>Supports</h2>
      <table>
        <thead>
          <tr><th>Level</th><th>Touches</th><th>Dist.</th></tr>
        </thead>
        <tbody id="supports"></tbody>
      </table>

      <h2>Resistances</h2>
      <table>
        <thead>
          <tr><th>Level</th><th>Touches</th><th>Dist.</th></tr>
        </thead>
        <tbody id="resistances"></tbody>
      </table>
    </aside>
  </main>

  <script src="node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script src="app.js"></script>
</body>
</html>
