<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BloFin BTC Live Support/Resistance</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101418;
      --panel: #171d22;
      --text: #eef3f6;
      --muted: #9ba8b2;
      --border: #2b3640;
      --price: #6bb8ff;
      --support: #49c178;
      --resistance: #ff6b75;
      --current: #f2d36b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      min-height: 100vh;
      padding: 16px;
    }

    .chart-wrap,
    aside {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .chart-wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 560px;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .meta,
    .status,
    .small {
      color: var(--muted);
      font-size: 13px;
    }

    #chart {
      display: block;
      width: 100%;
      min-height: 520px;
      flex: 1;
    }

    aside {
      padding: 14px;
      overflow: auto;
    }

    .price {
      font-size: 28px;
      font-variant-numeric: tabular-nums;
      margin: 4px 0 14px;
    }

    h2 {
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    td,
    th {
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      text-align: right;
      white-space: nowrap;
    }

    td:first-child,
    th:first-child {
      text-align: left;
    }

    .support {
      color: var(--support);
    }

    .resistance {
      color: var(--resistance);
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
      }

      .chart-wrap {
        min-height: 480px;
      }

      #chart {
        min-height: 440px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="chart-wrap" aria-label="Live BTC price chart">
      <header>
        <div>
          <h1 id="title">BTC-USDT live chart</h1>
          <div class="meta" id="subtitle">Waiting for market data...</div>
        </div>
        <div class="status" id="status">connecting</div>
      </header>
      <canvas id="chart"></canvas>
    </section>
    <aside>
      <div class="small">Last price</div>
      <div class="price" id="lastPrice">--</div>

      <h2>Supports</h2>
      <table>
        <thead>
          <tr><th>Level</th><th>Touches</th><th>Dist.</th></tr>
        </thead>
        <tbody id="supports"></tbody>
      </table>

      <h2>Resistances</h2>
      <table>
        <thead>
          <tr><th>Level</th><th>Touches</th><th>Dist.</th></tr>
        </thead>
        <tbody id="resistances"></tbody>
      </table>
    </aside>
  </main>

  <script>
    const state = {
      candles: [],
      supports: [],
      resistances: [],
      currentPrice: null,
      instId: "BTC-USDT",
      bar: "15m",
      updatedAt: null
    };

    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const titleEl = document.getElementById("title");
    const subtitleEl = document.getElementById("subtitle");
    const lastPriceEl = document.getElementById("lastPrice");
    const supportsEl = document.getElementById("supports");
    const resistancesEl = document.getElementById("resistances");

    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function formatPrice(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "--";
      return Number(value).toLocaleString(undefined, {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1
      });
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      draw();
    }

    function priceDomain() {
      const values = [];
      for (const candle of state.candles) {
        values.push(candle.low, candle.high, candle.close);
      }
      for (const level of state.supports) values.push(level.level);
      for (const level of state.resistances) values.push(level.level);
      if (state.currentPrice) values.push(state.currentPrice);
      if (!values.length) return [0, 1];
      let min = Math.min(...values);
      let max = Math.max(...values);
      const pad = Math.max((max - min) * 0.08, 1);
      return [min - pad, max + pad];
    }

    function draw() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);

      const candles = state.candles;
      if (!candles.length) {
        ctx.fillStyle = cssVar("--muted");
        ctx.fillText("Waiting for candles...", 28, 34);
        return;
      }

      const pad = { left: 72, top: 24, right: 22, bottom: 42 };
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const [minPrice, maxPrice] = priceDomain();

      const xFor = (index) => pad.left + (candles.length === 1 ? plotW / 2 : (index / (candles.length - 1)) * plotW);
      const yFor = (price) => pad.top + ((maxPrice - price) / (maxPrice - minPrice)) * plotH;

      ctx.strokeStyle = cssVar("--border");
      ctx.lineWidth = 1;
      ctx.strokeRect(pad.left, pad.top, plotW, plotH);

      ctx.font = "12px ui-sans-serif, system-ui";
      ctx.fillStyle = cssVar("--muted");
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let i = 0; i <= 5; i++) {
        const price = maxPrice - ((maxPrice - minPrice) * i / 5);
        const y = yFor(price);
        ctx.strokeStyle = cssVar("--border");
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
        ctx.stroke();
        ctx.fillText(formatPrice(price), pad.left - 8, y);
      }

      const wickStep = Math.max(1, Math.floor(candles.length / 180));
      ctx.strokeStyle = cssVar("--muted");
      ctx.globalAlpha = 0.42;
      for (let i = 0; i < candles.length; i += wickStep) {
        const candle = candles[i];
        const x = xFor(i);
        ctx.beginPath();
        ctx.moveTo(x, yFor(candle.high));
        ctx.lineTo(x, yFor(candle.low));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      ctx.strokeStyle = cssVar("--price");
      ctx.lineWidth = 2;
      ctx.beginPath();
      candles.forEach((candle, index) => {
        const x = xFor(index);
        const y = yFor(candle.close);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      function drawLevels(levels, color, prefix, labelSide) {
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 1.5;
        ctx.font = "12px ui-sans-serif, system-ui";
        levels.forEach((level, index) => {
          const y = yFor(level.level);
          ctx.beginPath();
          ctx.moveTo(pad.left, y);
          ctx.lineTo(width - pad.right, y);
          ctx.stroke();
          ctx.textAlign = labelSide === "left" ? "left" : "right";
          const x = labelSide === "left" ? pad.left + 8 : width - pad.right - 8;
          ctx.fillText(`${prefix}${index + 1} ${formatPrice(level.level)} (${level.touches}x)`, x, y - 8);
        });
      }

      drawLevels(state.supports, cssVar("--support"), "S", "left");
      drawLevels(state.resistances, cssVar("--resistance"), "R", "right");

      if (state.currentPrice) {
        const y = yFor(state.currentPrice);
        ctx.save();
        ctx.strokeStyle = cssVar("--current");
        ctx.setLineDash([7, 5]);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle = cssVar("--current");
        ctx.textAlign = "right";
        ctx.fillText(`last ${formatPrice(state.currentPrice)}`, width - pad.right - 8, y + 14);
      }

      ctx.fillStyle = cssVar("--muted");
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const first = new Date(candles[0].ts).toLocaleString();
      const last = new Date(candles[candles.length - 1].ts).toLocaleString();
      ctx.fillText(`${first} to ${last}`, pad.left + plotW / 2, height - 26);
    }

    function renderTable(target, levels) {
      target.innerHTML = "";
      for (const level of levels) {
        const tr = document.createElement("tr");
        const distance = state.currentPrice === null ? null : Math.abs(level.level - state.currentPrice);
        tr.innerHTML = `<td>${formatPrice(level.level)}</td><td>${level.touches}</td><td>${formatPrice(distance)}</td>`;
        target.appendChild(tr);
      }
      if (!levels.length) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="3">None in range</td>`;
        target.appendChild(tr);
      }
    }

    function applyUpdate(payload) {
      state.candles = payload.candles || state.candles;
      state.supports = payload.supports || state.supports;
      state.resistances = payload.resistances || state.resistances;
      state.currentPrice = payload.currentPrice ?? state.currentPrice;
      state.instId = payload.instId || state.instId;
      state.bar = payload.bar || state.bar;
      state.updatedAt = payload.updatedAt || state.updatedAt;

      titleEl.textContent = `${state.instId} live chart`;
      subtitleEl.textContent = `${state.bar} candles, support and resistance recalculated from live/demo BloFin data`;
      lastPriceEl.textContent = formatPrice(state.currentPrice);
      renderTable(supportsEl, state.supports);
      renderTable(resistancesEl, state.resistances);
      draw();
    }

    function connect() {
      const socket = new WebSocket(`ws://${location.hostname || "127.0.0.1"}:8766`);
      statusEl.textContent = "connecting";

      socket.addEventListener("open", () => {
        statusEl.textContent = "live";
      });

      socket.addEventListener("message", (event) => {
        applyUpdate(JSON.parse(event.data));
      });

      socket.addEventListener("close", () => {
        statusEl.textContent = "reconnecting";
        setTimeout(connect, 1500);
      });

      socket.addEventListener("error", () => {
        statusEl.textContent = "connection error";
      });
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    connect();
  </script>
</body>
</html>
